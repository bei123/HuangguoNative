# 产出「未签名 IPA」，供用户用 AltStore / Sideloadly / 自有证书重签安装。
# 推送 v* 标签时，自动创建/更新 GitHub Release，并把 IPA 挂到 Assets。

name: Build IPA (unsigned)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  SCHEME: HuangguoNative
  PROJECT: HuangguoNative.xcodeproj

jobs:
  ipa:
    name: Unsigned IPA for sideload
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Resolve version name
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME}"
          else
            VER="dev-${GITHUB_SHA::7}"
          fi
          echo "VERSION=$VER" >> "$GITHUB_ENV"
          echo "IPA_NAME=HuangguoNative-${VER}-unsigned.ipa" >> "$GITHUB_ENV"

      - name: Build Release (no code sign)
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP=$(find build/DerivedData/Build/Products/Release-iphoneos -name '*.app' -maxdepth 1 | head -n 1)
          if [ -z "$APP" ]; then
            echo "Release-iphoneos .app not found"
            find build/DerivedData/Build/Products -type d -name '*.app' || true
            exit 1
          fi
          echo "Packaging: $APP -> $IPA_NAME"
          rm -rf build/Payload build/ipa
          mkdir -p build/Payload build/ipa
          cp -R "$APP" build/Payload/
          (
            cd build
            zip -r -q "ipa/${IPA_NAME}" Payload
          )
          ls -lh build/ipa/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HuangguoNative-unsigned-ipa
          path: build/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: build/ipa/*.ipa
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
