# 产出「未签名 IPA」，供用户用 AltStore / Sideloadly / 自有证书重签安装。
# 不上架 App Store，CI 不需要你的 Apple 开发者证书。

name: Build IPA (unsigned)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  SCHEME: HuangguoNative
  PROJECT: HuangguoNative.xcodeproj

jobs:
  ipa:
    name: Unsigned IPA for sideload
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build Release (no code sign)
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP=$(find build/DerivedData/Build/Products/Release-iphoneos -name '*.app' -maxdepth 1 | head -n 1)
          if [ -z "$APP" ]; then
            echo "Release-iphoneos .app not found"
            find build/DerivedData/Build/Products -type d -name '*.app' || true
            exit 1
          fi
          echo "Packaging: $APP"
          rm -rf build/Payload build/ipa
          mkdir -p build/Payload build/ipa
          cp -R "$APP" build/Payload/
          (
            cd build
            zip -r -q "ipa/HuangguoNative-unsigned.ipa" Payload
          )
          ls -lh build/ipa/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HuangguoNative-unsigned-ipa
          path: build/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30
